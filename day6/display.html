<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color: red;
            
        }

        p.ex1{
            display: none;
        }

        p.ex2{
            display: block;
            background-color: palegoldenrod;
        }

        p.ex3{
            display: inline;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <h1>Display : None</h1>
    <div>
        Here Display None means Nothing To Display
        <p class="ex1">Hello Display None</p>

    </div>


    <h1>Display : Block</h1>
    <div>
        Here Display Block means - Block Level  Element - 100% Width of space 
        <p class="ex2">Hello Display Block</p>
    </div>


    <h1>Display : Inline</h1>
    <div>
        Here Display Inline Means Like Span - Required amount of width
        <p class="ex3">Hello Display Inline</p>
    </div>
</body>
</html>
