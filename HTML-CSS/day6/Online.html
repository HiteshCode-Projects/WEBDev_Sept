    <style>
            body{
                font-family: Arial;
                background-color: #f9f9f9;
                height: 100vh;


               
            }

            .ecom{
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
                gap: 25px;
            }


        .product{
            border: 1px solid black;
            border-radius: 12px;
          

            padding: 12px;
            margin-bottom: 15px;

            text-align: center;

            box-shadow: 4px 4px  8px black;
        }


        .product img{
            width: 100%;
            height: 160px;
            object-fit: cover;

            border-radius: 12px;
        }


        .product:hover{
            background-color: #eba0a0;
            color: white;

            transition: 2s;

            transform: scale(1.03);

        }


        .product button{
            background-color: orange;
            padding: 10px;
            border: none;
            border-radius: 12px;
            width: 90%;
        }
    </style>
</head>
