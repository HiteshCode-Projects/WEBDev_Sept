<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      .product{
        display: grid;
        /* grid-template-columns: 200px 200px 400px; */

        /* grid-template-columns: 1fr 1fr 1fr; */

        /* grid-template-columns: repeat(No of Column , Size of Column); */

        /* grid-template-columns: repeat(7,1fr); */

        grid-template-columns: repeat(auto-fit , minmax(250px,1fr));


        gap: 10px;
      }


        .box{
            border: 1px solid black;
            background-color: red;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="product">
        <div class="box">Cake</div>
        <div class="box">Cake-Price</div>
        <div class="box">Cookie</div>
        <div class="box">Cookie-Price</div>
        <div class="box">Pastry</div>
        <div class="box">Pastry-Price</div>
    </div>
</body>
</html>
