<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>Username</label>
    <input placeholder="Enter Your Name"> <br><br>


    <!-- Input Types 
    abc@xyz.com 
    -->

    <input type="text" placeholder="username"><br><br>

    <input type="email" placeholder="abc@example.com"><br><br>

    <input type="password" placeholder="******"><br><br>

    <input type="url" placeholder="https://yoursite.com"><br><br>

    <input type="tel" placeholder="+91 987654321"><br><br>

    <!-- Date and Time -->
     <input type="date">
     <input type="time">

     <input type="datetime-local">
     <input type="month">
     <input type="week">

     <!-- Selection Box -->
      <input type="checkbox">
      <label>I agreen to terms and conditon</label>


      <!-- Sepcical Input -->
       <input type="file">
       <input type="color">
       <input type="range">
       <input type="number" placeholder="number">

       <!-- Validation -->
        <input type="text"  placeholder="name" required>

        <input type="text" placeholder="username" minlength="3"  maxlength="10"><br>

        <input type="tel" placeholder="phone no" pattern="[0-9]{10}"><br>

        <!-- Feedback and Reviwews -->

        <textarea  rows="10" cols="15" placeholder="feedback"></textarea>

</body>
</html>
