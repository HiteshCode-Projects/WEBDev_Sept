<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
    //Loop : Repeating the same Task

    //Golden  Rule : When CONDITION IS TRUE LOOP WILL START AND WHEN CONDITION IS FALSE LOOP STOPS
    
    //1. for(start point; ending/condition; operators- ++ / --) Loop
    // Startint Point and Ending Point Use FOR LOOP

    //Task - Print Numbers 1 to 10 in console
    // console.log(1)
    //  console.log(2)  .... 10 times

    for(let i = 1; i <= 10; i++){
        //Task
        console.log("The Value is " , i)  //1 time
    }


    //Print 10 to 1
    for(let j =10 ; j>=1  ; j--){
        //Task
        console.log("The Value is " , j)  //1 time
    }    

    //while(Condition) Loop 
    //Rule : When CONDITION IS TRUE LOOP WILL START AND WHEN CONDITION IS FALSE LOOP STOPS
    

    let count = 1

    while(count<=5){

        console.log("Good Evening Everyone") //
        count++;
    }

    //Do While loop : It will Execute/Run The Code Atleast for 1 time

     let number = 7
    do{
        console.log("Helllo Guys")
        
    }while(number<5)





      
      
      
      
      
      
    </script>  
</body>
</html>
