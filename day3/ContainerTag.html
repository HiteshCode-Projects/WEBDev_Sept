<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <!-- Div Container - IT is Box In which We can add Content by using
   Any HTML Tag - It Always Takes 100% width - By default 
   Block Level element/Tag -->

   <div style="background-color: beige; width: 250px;">
    <h2>Reviews</h2>

    <div style="background-color: burlywood; width: 200px;">
        <h3>Ayush</h3>
        <p>It was good ⭐⭐⭐⭐</p>
    </div>

    <div style="background-color: burlywood; width: 200px;">
        <h3>Abhishek</h3>
        <p>It was great ⭐⭐⭐</p>
    </div>

   </div>


   <div style="background-color: aqua; width: 250px;">
    <h2>Support</h2>
    <p>abc@gmail.com</p>
    <p>+91 1234566</p>
    <p>Location , IN</p>
   </div>


   <!-- Span Tag
   It only Takes Required Amount of width as per content
   Inline Element 
   It can fit inside  any HTML Tag -->

   <p>Good  <span style="background-color: blueviolet;">Morning</span>       Ayush</p>


   <button>Cart 0</button>
   <button>Cart <span style="background-color: brown;">0</span></button>
</body>
</html>
